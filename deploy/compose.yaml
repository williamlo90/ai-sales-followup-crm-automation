# Bounded container dependencies; native domain runtime is configured separately.
name: sales-followup-lab
services:
  postgres:
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    pull_policy: never
    profiles: [data]
    environment:
      POSTGRES_DB: sales_lab
      POSTGRES_USER: sales_lab_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5444:5432"]
    volumes: ["sales_pg:/var/lib/postgresql/data"]
    command: [postgres, -c, shared_buffers=32MB, -c, work_mem=1MB, -c, maintenance_work_mem=16MB, -c, max_connections=10]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sales_lab_owner -d sales_lab"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:f6dc0d15bc9620baf5ba1df834ef81ae4e969f778c09300e567217be88f04a96
    pull_policy: never
    profiles: [engine]
    environment:
      TZ: Asia/Jakarta
      GENERIC_TIMEZONE: Asia/Jakarta
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      NODE_OPTIONS: --max-old-space-size=320
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
    secrets: [n8n_encryption_key]
    ports: ["127.0.0.1:5684:5678"]
    volumes: ["sales_n8n:/home/node/.n8n"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 96
volumes:
  sales_pg:
  sales_n8n:
secrets:
  postgres_password:
    file: ../local/secrets/postgres_password
  n8n_encryption_key:
    file: ../local/secrets/n8n_encryption_key
